<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Static <title> + <meta name="description"> — a fallback for anything
      reading the raw HTML without running JavaScript (some crawlers,
      social-share scrapers, link previewers). Once JS runs, every route
      renders its own via src/components/SEO.jsx (react-helmet-async) —
      src/main.jsx removes this static description tag right before that
      happens, so a JS-capable visitor never sees both at once.
    -->
    <title>Zanokuhle Intellectuals Academy</title>
    <meta
      name="description"
      content="Zanokuhle Intellectuals Academy is a registered South African NPO delivering early childhood development, education, skills and community programmes."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
