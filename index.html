<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Static <title> only — a pre-hydration fallback for the instant before
      React mounts (and for anything reading the raw HTML without running
      JS). No static <meta name="description"> here on purpose: every route
      renders its own via src/components/SEO.jsx, and react-helmet-async
      appends rather than replaces a tag it didn't itself render, so a
      static one here would sit alongside the real one as a duplicate.
    -->
    <title>Zanokuhle Intellectuals Academy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
