name: CI

# Runs the same checks a contributor should run locally before pushing —
# lint and a production build — on every push and pull request against
# main. The build step also exercises scripts/generate-seo-files.mjs and
# scripts/prerender.mjs (see those files); prerendering needs a Chromium
# browser, installed below, but scripts/prerender.mjs itself is written to
# degrade gracefully (warn, don't fail the build) if that's ever
# unavailable — see its own comments.
#
# A second job, deploy, publishes the site to GitHub Pages on every push
# to main (not on pull requests) once lint-and-build has passed. It's a
# separate job rather than reusing lint-and-build's artifact because it
# needs its own build with different env vars: VITE_SITE_URL set to the
# real live Pages URL (so canonical/OG/JSON-LD tags are correct there,
# instead of the placeholder domain lint-and-build deliberately uses) and
# VITE_BASE_PATH set to the repo subpath GitHub Pages project sites are
# served under.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright's Chromium (used by the postbuild prerender step)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          # Normally empty, and that's correct: the real domain is now the
          # built-in default (src/lib/siteConfig.js), so an unset variable
          # produces correct production URLs. This override exists only so
          # a fork or a staging environment can point builds at a different
          # hostname by setting a repository variable.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium (used by the postbuild prerender step)
        run: npx playwright install --with-deps chromium

      - name: Build for GitHub Pages
        run: npm run build
        # No VITE_SITE_URL or VITE_BASE_PATH needed any more. The site is
        # served from the custom domain zanokuhleintellectuals.co.za at its
        # root, which is exactly what the defaults now produce:
        # src/lib/siteConfig.js defaults to that domain, and vite.config.js
        # defaults `base` to "/". public/CNAME is what tells GitHub Pages to
        # serve the custom domain instead of the /<repo>/ project subpath.

      - name: Configure GitHub Pages
        # Reads the repository's existing Pages configuration. Pages must
        # already be enabled with "Source: GitHub Actions" under
        # Settings → Pages — that is a one-time manual step and cannot be
        # automated from here: creating a Pages site through the API needs
        # repository admin rights, which the workflow's GITHUB_TOKEN does
        # not have. `pages: write` (granted above) only permits *deploying*
        # to a site that already exists. Trying `enablement: true` fails
        # with "Create Pages site failed: Resource not accessible by
        # integration", so it is deliberately not set here.
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
