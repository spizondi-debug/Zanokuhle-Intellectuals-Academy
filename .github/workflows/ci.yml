name: CI

# Runs the same checks a contributor should run locally before pushing —
# lint and a production build — on every push and pull request against
# main. The build step also exercises scripts/generate-seo-files.mjs and
# scripts/prerender.mjs (see those files); prerendering needs a Chromium
# browser, installed below, but scripts/prerender.mjs itself is written to
# degrade gracefully (warn, don't fail the build) if that's ever
# unavailable — see its own comments.
#
# A second job, deploy, publishes the site to GitHub Pages on every push
# to main (not on pull requests) once lint-and-build has passed. It's a
# separate job rather than reusing lint-and-build's artifact because it
# needs its own build with different env vars: VITE_SITE_URL set to the
# real live Pages URL (so canonical/OG/JSON-LD tags are correct there,
# instead of the placeholder domain lint-and-build deliberately uses) and
# VITE_BASE_PATH set to the repo subpath GitHub Pages project sites are
# served under.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright's Chromium (used by the postbuild prerender step)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          # Unset in CI on purpose — no real domain is configured here.
          # scripts/generate-seo-files.mjs falls back to a clearly-marked
          # placeholder and warns rather than failing; set this as a repo
          # or environment secret/variable once a real domain exists, so
          # production deploys build against it instead.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium (used by the postbuild prerender step)
        run: npx playwright install --with-deps chromium

      - name: Build for GitHub Pages
        run: npm run build
        env:
          # Once a real custom domain exists for Zanokuhle, replace both of
          # these: set VITE_SITE_URL to that domain (as a repo/environment
          # variable, same as lint-and-build above) and drop VITE_BASE_PATH
          # entirely — a custom domain serves from the root, not this
          # project-page subpath.
          VITE_SITE_URL: https://spizondi-debug.github.io/Zanokuhle-Intellectuals-Academy
          VITE_BASE_PATH: /Zanokuhle-Intellectuals-Academy/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # v5's own default is false, which only reads the Pages site's
          # existing config — on a repo where Pages has never been
          # enabled, that 404s ("Get Pages site failed ... Not Found")
          # instead of creating it. true makes it create the site (source:
          # GitHub Actions) via the API using this job's `pages: write`
          # permission, so the very first run succeeds without anyone
          # needing to click through Settings → Pages by hand first.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
